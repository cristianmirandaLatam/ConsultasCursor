<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d68">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ctgenai-tema");
        if (t !== "oscuro" && t !== "claro") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
        }
        document.documentElement.setAttribute("data-tema", t);
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Simulador de práctica del examen ISTQB CT-GenAI: examen real y examen de prueba.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CT-GenAI">
  <title>Simulador de práctica CT-GenAI</title>
  <link rel="icon" href="favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div id="app"></div>
  <script src="banco.js"></script>
  <script src="porques.js"></script>
  <script src="silabo.js"></script>
  <script src="app.js"></script>
</body>
</html>
